name: Reintentar servidor Oracle

# Intenta crear el servidor "portal-ramos" (Always Free) en Oracle São Paulo cada ~3 minutos.
# Cada ejecución dura ~5,5 horas y al terminar se vuelve a lanzar sola; el cron horario es respaldo.
# Primero 2 núcleos / 12 GB; si no hay capacidad, 1 núcleo / 6 GB.
# Cuando lo consigue: abre un issue (te llega un correo) y desactiva este flujo.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  issues: write
  contents: read

concurrency:
  group: reintentar-oracle
  cancel-in-progress: false

env:
  AD: "Medu:SA-SAOPAULO-1-AD-1"
  SUBNET: "ocid1.subnet.oc1.sa-saopaulo-1.aaaaaaaa7zyyydkljusuhzy6gwdtsueec7tsf55eh5prs5ools6hoht2npsa"
  IMAGE: "ocid1.image.oc1.sa-saopaulo-1.aaaaaaaaw5a236wd55o7ecdrk5xmyuuiobzyidi2trqrgexeyt4rm3ytl7sa"
  SUPPRESS_LABEL_WARNING: "True"
  PYTHONWARNINGS: "ignore"

jobs:
  intentar:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements.txt

      - name: Instalar OCI CLI
        run: pip install -q -r .github/requirements.txt

      - name: Configurar credenciales
        env:
          OCI_KEY: ${{ secrets.OCI_KEY }}
        run: |
          mkdir -p ~/.oci && chmod 700 ~/.oci
          printf '%s\n' "$OCI_KEY" > ~/.oci/key.pem && chmod 600 ~/.oci/key.pem
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=${{ secrets.OCI_USER }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY }}
          region=sa-saopaulo-1
          key_file=$HOME/.oci/key.pem
          EOF
          chmod 600 ~/.oci/config

      - name: Intentar crear el servidor
        id: crear
        env:
          T: ${{ secrets.OCI_TENANCY }}
        run: |
          existentes=$(oci compute instance list --compartment-id "$T" --display-name portal-ramos \
            --query 'data[?"lifecycle-state"!=`TERMINATED` && "lifecycle-state"!=`TERMINATING`] | length(@)' \
            --raw-output)
          # Sin instancias, Oracle devuelve una respuesta vacía: se cuenta como 0.
          existentes=${existentes:-0}
          if [ "$existentes" != "0" ]; then
            echo "Ya existe un servidor portal-ramos."
            echo "resultado=existe" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          intentar() {
            oci --no-retry compute instance launch \
              --availability-domain "$AD" --compartment-id "$T" \
              --display-name portal-ramos \
              --shape VM.Standard.A1.Flex --shape-config "{\"ocpus\":$1,\"memoryInGBs\":$2}" \
              --image-id "$IMAGE" --boot-volume-size-in-gbs 200 \
              --subnet-id "$SUBNET" --assign-public-ip true \
              --is-pv-encryption-in-transit-enabled true \
              --ssh-authorized-keys-file llave-ssh.pub > salida.txt 2>&1
          }

          fin=$(( $(date +%s) + 330*60 ))
          ronda=0
          errores=0
          while [ "$(date +%s)" -lt "$fin" ]; do
            ronda=$((ronda+1))
            for tam in "2 12" "1 6"; do
              set -- $tam
              if intentar "$1" "$2"; then
                echo "CONSEGUIDO: $1 núcleo(s) / $2 GB (ronda $ronda)"
                echo "resultado=creado" >> "$GITHUB_OUTPUT"
                echo "tamano=$1 núcleo(s) / $2 GB" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              if grep -qi "capacity" salida.txt; then
                echo "$(date -u +%H:%M) ronda $ronda: sin capacidad para $1/$2 GB."
                errores=0
              elif grep -qi "TooManyRequests\|Too many requests" salida.txt; then
                echo "$(date -u +%H:%M) Oracle pide ir más despacio; espero 10 minutos."
                sleep 600
                break
              else
                errores=$((errores+1))
                echo "$(date -u +%H:%M) error inesperado ($errores seguidos):"; grep -v -i "ocid1" salida.txt | head -20
                [ "$errores" -ge 5 ] && exit 1
                break
              fi
              sleep 20
            done
            sleep $(( 160 + RANDOM % 40 ))
          done
          echo "resultado=sin-capacidad" >> "$GITHUB_OUTPUT"

      - name: Relanzar
        if: steps.crear.outputs.resultado == 'sin-capacidad'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run reintentar.yml --repo "$GITHUB_REPOSITORY"

      - name: Avisar y desactivar
        if: steps.crear.outputs.resultado == 'creado' || steps.crear.outputs.resultado == 'existe'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Servidor portal-ramos creado en Oracle" \
            --body "El servidor ya existe en Oracle São Paulo (${{ steps.crear.outputs.tamano }}). Los reintentos se desactivaron solos. Siguiente paso: IP fija, puertos 80/443, DuckDNS e instalación de Nextcloud." || true
          gh workflow disable reintentar.yml --repo "$GITHUB_REPOSITORY"

      - name: Borrar credenciales
        if: always()
        run: rm -rf ~/.oci salida.txt
